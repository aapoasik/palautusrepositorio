[project]
name = "palautusrepositorio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aapo Asikainen", email = "aapo.asikainen@helsinki.fi" }
]
requires-python = ">=3.14"
dependencies = [
    "coverage>=7.17.5",
    "pytest>=9.2.0",
]

[project.scripts]
palautusrepositorio = "palautusrepositorio:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.17.5",
]
